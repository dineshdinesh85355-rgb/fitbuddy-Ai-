<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        FitBuddy
        {% endblock %}
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/static/styles.css"
    >

</head>


<body>


<header class="topbar">

    <a
        class="brand"
        href="/"
    >
        FitBuddy
    </a>


    <nav>

        <a href="/">
            Create Plan
        </a>

        <a href="/docs">
            API Docs
        </a>

        <a href="/admin">
            Admin
        </a>

    </nav>

</header>


<main class="container">

    {% block content %}
    {% endblock %}

</main>


<footer>

    <p>
        FitBuddy is a general wellness application,
        not medical advice.
    </p>

</footer>


<script src="/static/app.js"></script>

</body>

</html>
